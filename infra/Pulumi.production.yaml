# Stack config for production. Fill in the account facts before the first
# `pulumi up`; secrets (the API token) are set with `pulumi config set
# --secret`, never committed in plaintext.
config:
  seldon:accountId: REPLACE_WITH_CLOUDFLARE_ACCOUNT_ID
  seldon:zoneId: REPLACE_WITH_ZONE_ID
  seldon:accessTeamName: seldon
  # Identities allowed through Cloudflare Access in this environment.
  seldon:accessEmails:
    - me@alancole.io
