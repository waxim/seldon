id: census-household-composition
name: 2021 Census — Household Composition
group: demographic
description: >-
  Households by composition (single person, couple, family with children, and
  so on) per Output Area from the 2021 Census of England and Wales (table
  TS003). Shapes the size and make-up of synthesised households.
publisher: Office for National Statistics
licence: OGL-3.0
homepage: https://www.nomisweb.co.uk/sources/census_2021_bulk
status: ready
normalised: true
ingest:
  apiSource: census-2021
fetch:
  url: https://www.nomisweb.co.uk/output/census/2021/census2021-ts003.zip
  format: zip
  release: census-2021
process:
  - kind: unzip
    member: census2021-ts003-oa.csv
    to: census-household-composition-oa.csv
output:
  processed: census-household-composition-oa.csv
notes: >-
  ONS 2021 Census bulk table TS003. Unlike the other census tables its column
  headers are double-quoted and carry a "; measures: Value" suffix — the
  ingest loader normalises them.
