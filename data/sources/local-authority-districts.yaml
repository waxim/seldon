id: local-authority-districts
name: Local Authority Districts
group: geography
description: >-
  Names and GSS codes for UK local authority districts — the councils the
  ward layer rolls up into. Loaded into psephos-api as the councils table.
publisher: Office for National Statistics
licence: OGL-3.0
homepage: https://geoportal.statistics.gov.uk/
status: ready
normalised: true
ingest:
  apiSource: boundaries-2024
fetch:
  url: https://opendata.arcgis.com/api/v3/datasets/984b3f485d1a4c0f9d9e51617cafc224_0/downloads/data?format=csv&spatialRefId=4326
  format: csv
  release: december-2024
process:
  - kind: csv-select
    columns: [LAD24CD, LAD24NM]
  - kind: csv-rename
    columns:
      LAD24CD: id
      LAD24NM: name
output:
  processed: local-authority-districts.csv
notes: >-
  ONS "Local Authority Districts (December 2024) Names and Codes in the UK".
  The December 2024 vintage matches the LAD24CD codes used in
  ward-constituency-lookup and output-area-ward-lookup.
