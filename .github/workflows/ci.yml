# Every pull request: verify, then upload a preview version per app.
name: ci

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile

      # One cached task graph: typecheck + lint + test (tests run in
      # workerd, with each service's D1 booted from its migration chain).
      - run: bun run check

      # The two IaC layers must still agree: every wrangler.jsonc is
      # re-derived from the resource table and the synced Pulumi outputs.
      - run: bun run infra:check

      # The Worker bundles must build and their configs must validate,
      # without touching the account.
      - run: bun run build
      - run: bun run deploy:dry-run

  preview:
    needs: verify
    runs-on: ubuntu-latest
    # Previews use staging resources, so they carry the staging token.
    environment: staging
    # Forks do not get the deploy token; their PRs stop at verify.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build

      # Uploads a version per app WITHOUT deploying it; wrangler mints a
      # preview URL per version.
      - run: bun run preview --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment preview URLs
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview
          path: preview-urls.md
